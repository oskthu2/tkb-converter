  - id: e-tjanster
    title: Utveckling av e-tjänster
    text: >-
      Mallarna är främst tänkta som stöd för projekt som utvecklar gemensamma
      (nationella) tjänster, men de kan även fylla en viktig funktion i
      regionala eller lokala projekt.
