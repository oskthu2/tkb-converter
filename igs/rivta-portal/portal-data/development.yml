  - id: tjanstekontrakt
    title: Utveckling av tjänstekontrakt
    text: >-
      Tjänstekontrakt är specifikationer som reglerar vilken information som
      utbyts mellan olika system. De baseras på internationella standarder och
      är upprättade enligt anvisningar för teknisk interoperabilitet. Inera
      förvaltar livscykeln för de nationella tjänstekontrakten, såsom hantering
      av förändrade krav och behov, versionshantering och spelreglerna vid
      utfasning.
