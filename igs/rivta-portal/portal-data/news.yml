  - date: 2014-08-04
    title: Uppdatering av script för hantering av domäner
    body: |
      <p>Scriptet för att verifiera innehåll i en tjänstedomän har uppdaterats till version 1.2.</p>
      <ul>
        <li>Motsvarar nu den aktuella version 2.0.5 av RIVTA Konfigurationsstyrning.</li>
        <li>Ändrad regel för förenkling av namnsättning av TKB och AB.</li>
        <li>Bättre kontroll av versionsnumrering.</li>
        <li>Visar om ändringar skett i en tag efter det att den skapas.</li>
        <li>Tydligare meddelanden.</li>
      </ul>
      <p>Se <a href="https://code.google.com/p/rivta/wiki/ToolsDomainManagement">här</a> för mer information och länk till programmet (Google Code är avvecklat sedan 2015).</p>

  - date: 2014-06-30
    title: Uppdatering 2.0.5 av Konfigurationsstyrningen publicerad
    body: |
      <p>En uppdatering av konfigurationsstyrningen har publicerats. De viktigaste förändringarna framgår av revisionshistoriken, och är:</p>
      <ul>
        <li>Ersatte alla referenser till ”CeHis” med ”Inera”.</li>
        <li>Tog bort alla referenser till självdeklaration av följsamhet.</li>
        <li>Fixade enstaka typos.</li>
        <li>Ändrade namnsättningsregeln för TKB och AB. Dessa skall inte längre ha versionsbeteckning i filnamnet.</li>
        <li>Förtydliga mappstrukturen och kravet på en undermapp per interaktion (WSDL-fil).</li>
        <li>Förtydliga versionsreglerna. Tredje versionstalet uppstår endast efter den första dokumentationsuppdateringen och kan därför aldrig vara 0.</li>
        <li>Förtydliga att Inera Arkitektur och regelverk skapar zip-filerna vid release.</li>
        <li>Förtydliga att en tag alltid skapas mha kommandot ”svn copy”. Adderade Bilaga 5 som beskriver hur en tjänstedomän byter namn (namnrymd).</li>
      </ul>
      <p>Ni hittar, som alltid, dokumentet här: {doc:ARK_0007|ARK_0007}.</p>

  - date: 2014-04-08
    title: Ny revision av RIVTA Översikt publicerad
    body: |
      <p>En ny revision med fokus på källsystemsadressering och ändrade krav på hantering av anropsbehörighet har publicerats. Dokumentet återfinns via {doc:ARK_0001|ARK_0001}.</p>
