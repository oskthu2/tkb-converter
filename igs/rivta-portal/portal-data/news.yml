  - date: 2022-03-02
    title: Sårbarhet föranleder uppdatering av testsviter
    body: |
      <p>I slutet av 2021 upptäcktes en sårbarhet i komponenten Log4J. Log4J ingår som en komponent i SoapUI och ReadyAPI som använts för att ta fram de testsviter som ingår i de tjänstedomäner som Inera förvaltar. Ineras testsviter håller successivt på att uppdateras och publiceras på rivta.se. De testsviter som ännu inte uppdaterats fungerar endast med äldre versioner av SoapUI och ReadyAPI. Log4J har uppdaterats och inkluderats i version 5.6.1 av SoapUI och version 3.10.2 av ReadyAPI. I samband med detta har vissa funktioner tagits bort, vilket gör att de tidigare testsviterna inte längre är kompatibla med senaste versionerna av SoapUI och ReadyAPI.</p>
      <p>Information om vilka releasepaket som är uppdaterade med nya testsviter finns på <a href="https://inera.atlassian.net/wiki/spaces/OITOF/pages/2741764700/Log4J+-+Status+uppdaterade+testsviter">Log4J - Status uppdaterade testsviter</a>.</p>

