  - date: 2020-08-19
    title: Referensarkitektur för elektronisk underskrift och stämpel
    body: |
      <p>Inera publicerar referensarkitektur för elektronisk underskrift och stämpel som syftar till att ge stöd till utformning av IT-stöd för att skapa och validera e-underskrifter och e-stämplar. Referensarkitekturen kan i tillämpliga delar appliceras både inom en organisation, och vid samverkan mellan organisationer, till exempel vid delning av tjänster för elektronisk underskrift och hantering av interna och externa undertecknare. Referensarkitekturen är tänkt att användas som referensunderlag vid anskaffning och vidareutveckling av lösningar för elektronisk underskrift och stämpel samt tillhörande stödtjänster, vilket kan omfatta såväl upphandling av leverantörsprodukter, anpassning av befintlig IT-infrastruktur och kravställning på e-tjänster/IT-system för följsamhet till arkitekturen. Referensarkitekturen är tänkt att tillämpas av Inera, regioner och kommuner, men den kan även tillämpas av andra aktörer så som myndigheter och privata utförare.</p>
      <p>Läs mer: {doc:ARK_0060}</p>

  - date: 2020-08-19
    title: Referensarkitektur för grunddata och katalog
    body: |
      <p>Inera publicerar referensarkitektur för grunddata och kataloger. Grunddata, eller masterdata som det också kallas, är information om organisationer, personer, platser och tjänsteutbud, exempelvis roller, adress och kontaktuppgifter. Referensarkitekturen ska ge stöd till bland annat verksamhetsexperter och it-arkitekter när lösningar och tjänster som hanterar och använder grunddata och kataloger ska utvecklas. Referensarkitekturen bygger på både internationella och svenska ramverk, och tillämpning av standarder och etablerade metoder. Den ska stödja de som arbetar med hantering av grunddata om organisation, person, tjänst och kontaktuppgifter av olika slag. Den ska även vara ett stöd vid kravställning, utveckling och upphandling av it-system som används för att utbyta sådan information, samt vid förvaltning och framtagande av kataloglösningar. Referensarkitekturen är inte specifik för en viss domän, som exempelvis hälso- och sjukvård, utan ska kunna användas av Ineras alla intressenter som utgångspunkt för utveckling av verksamhets- och domänspecifika lösningar.</p>
      <p>Läs mer: {doc:ARK_0059}</p>

  - date: 2020-05-14
    title: Interoperabilitet - med andra ord
    body: |
      <p>Det är inte lätt att komma in som ny och börja jobba med nationella tjänster och integrationer. Det är många nya termer att sätta sig in i ("TAK-ning", "aggregerande tjänster"...), och annat betyder inte det man tror (ex att "en tjänstekonsument kan producera information"). För att underlätta introduktionen till området har vi tagit fram en liten text där de grundläggande begreppen sätts i ett sammanhang. Ni hittar den här: <a href="https://rivta.se/documents/ARK_0058/">ARK_0058</a>.</p>

  - date: 2018-08-27
    title: Uppdatering av RIV Tekniska anvisningar
